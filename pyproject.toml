[project]
name = "swiss-legal-ai"
version = "0.1.0"
description = "Phase 1: ingestion pipeline + RAG core for Swiss federal law, parliamentary activity, and financial data."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary" }
dependencies = [
    "httpx>=0.27",
    "SPARQLWrapper>=2.0",
    "beautifulsoup4>=4.12",
    "apscheduler>=3.10",
    "sentence-transformers>=3.0",
    # Direct (not just transitive via sentence-transformers) so `[tool.uv.sources]`
    # below actually applies — uv only honors a source override for a package that is a
    # direct dependency somewhere in the project, not a purely transitive one.
    "torch>=2.13",
    "qdrant-client>=1.9",
    "psycopg[binary]>=3.1",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "tenacity>=8.2",
    "langdetect>=1.0.9",
    "anthropic>=0.30",
    "openai>=1.35",
    "structlog>=24.1",
    "einops>=0.8.2",
    "streamlit>=1.60.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "respx>=0.21",
    "ruff>=0.5",
]
notebook = [
    "jupyter>=1.1.1",
    "ipykernel>=7.3.0",
    "nbformat>=5.10.4",
    "pandas>=2.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# GPU support: an NVIDIA GPU (RTX 3060 Ti) is present on the dev machine, but PyPI's
# plain `torch` wheel for Windows is CPU-only — CUDA builds are hosted on PyTorch's own
# index instead. Pin torch to the cu126 build (matches the installed driver's supported
# CUDA range) so `uv sync` resolves it consistently instead of silently falling back to
# CPU. Set EMBEDDING_DEVICE=cuda in .env to actually use it (src/config.py).
[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
