[project]
name = "swiss-legal-ai"
version = "0.1.0"
description = "RAG pipeline over Swiss federal law, parliamentary activity, and SNB financial data, with hybrid retrieval and verified citations."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "SPARQLWrapper>=2.0",
    "beautifulsoup4>=4.12",
    "sentence-transformers>=3.0",
    "torch>=2.13",
    "qdrant-client>=1.9",
    "psycopg[binary]>=3.1",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "tenacity>=8.2",
    "langdetect>=1.0.9",
    "anthropic>=0.30",
    "openai>=1.35",
    "structlog>=24.1",
    "streamlit>=1.60.0",
]

[project.optional-dependencies]
dev = [
    "numpy>=1.26",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "respx>=0.21",
    "ruff>=0.5",
]
notebook = [
    "jupyter>=1.1.1",
    "ipykernel>=7.3.0",
    "nbformat>=5.10.4",
    "pandas>=2.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
