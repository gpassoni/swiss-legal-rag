# Golden evaluation set (docs/architecture.md §3.9, scripts/run_eval.py).
#
# Small and high-signal by design, not exhaustive — see the risk note in
# docs/architecture.md: keep this small as legal-area coverage grows, don't let
# it become a second corpus to maintain. `expected_citations` are the (systematic_number,
# article) pairs a correct, well-grounded answer should cite; `run_eval.py` checks both
# retrieval recall@k against them and the deterministic citation-verifier pass rate.
#
# Cases tagged `graph: true` are picked specifically to exercise the 1-hop
# cross-reference expansion in orchestration.query_engine (processing.reference_extractor)
# — the ideal answer requires an article pulled in via a cross-reference, not just the
# top-retrieved chunk.
#
# NOTE: full-corpus runs require all target SR prefixes (see config.PREFIX_LABELS) to
# actually be ingested — civile/penale/procedura/costituzionale cases will show recall=0
# until that ingestion has completed (embedding is the bottleneck, see the architecture
# doc's measured timing). The tributario cases work against the pre-existing corpus.

- id: tributario-001
  area_of_law: tributario
  language: it
  question: >-
    Come viene tassato il reddito da sostanza immobiliare secondo la legge federale
    sull'imposta federale diretta?
  expected_citations:
    - systematic_number: "642.11"
      article: "21"

- id: tributario-002
  area_of_law: tributario
  language: it
  question: "Cosa si intende per reddito imponibile secondo la LIFD?"
  expected_citations:
    - systematic_number: "642.11"
      article: "16"

